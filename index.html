<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruleta del dardo</title>
<style>
  :root {
    --bg: #14213d;
    --bg-2: #0d1630;
    --panel: #1c2c52;
    --line: #34497d;
    --text: #f2f5ff;
    --muted: #9fb0d8;
    --accent: #ffd54a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(circle at 35% 40%, var(--bg), var(--bg-2));
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 340px;
    grid-template-rows: minmax(0, 1fr);
    gap: 24px;
    padding: 24px;
    height: 100vh;
    overflow: hidden;
  }

  /* ---------- Ruleta ---------- */
  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    min-width: 0;
    min-height: 0;
    height: 100%;
  }
  .wheel-wrap {
    position: relative;
    width: min(100%, calc(100vh - 48px - 84px - 12px));
    aspect-ratio: 1;
  }
  canvas#wheel { width: 100%; height: 100%; display: block; }

  /* Capa transparente donde vuela y se clava el dardo */
  canvas#fx {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 5;
  }

  .hub {
    position: absolute;
    left: 50%; top: 50%;
    width: 17%; height: 17%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 6px solid rgba(255,255,255,.35);
    background: #f4f6ff;
    color: #14213d;
    font-weight: 800;
    font-size: clamp(11px, 1.8vw, 22px);
    letter-spacing: .02em;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(0,0,0,.4);
  }
  .hub:hover:not(:disabled) { background: #fff; }
  .hub:disabled { cursor: default; opacity: .85; }
  .hub:focus-visible, button:focus-visible, textarea:focus-visible, input:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }

  .result {
    height: 84px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: center;
    font-size: clamp(22px, 3vw, 38px);
    font-weight: 800;
    line-height: 1.15;
    max-width: 100%;
    overflow-wrap: anywhere;
    color: var(--accent);
  }
  .result small {
    display: block;
    font-size: 16px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 4px;
  }

  /* ---------- Panel ---------- */
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 0;
    max-height: calc(100vh - 48px);
    align-self: center;
    width: 100%;
  }
  .panel h1 { font-size: 20px; margin: 0; }
  .panel p { margin: 0; font-size: 14px; color: var(--muted); }
  textarea {
    flex: 1;
    min-height: 220px;
    resize: vertical;
    background: #0f1a36;
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px;
    font: 16px/1.5 inherit;
    font-family: inherit;
  }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  label.check { display: flex; gap: 8px; align-items: center; font-size: 14px; cursor: pointer; }
  button.btn {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 14px;
    cursor: pointer;
  }
  button.btn:hover { background: #26396a; }
  button.primary {
    background: var(--accent);
    color: #14213d;
    border-color: var(--accent);
    font-weight: 700;
    width: 100%;
    padding: 12px;
    font-size: 17px;
  }
  button.primary:hover { background: #ffe283; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .count { font-size: 13px; color: var(--muted); }

  /* ---------- Ganador ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    background: rgba(8, 14, 32, .86);
    padding: 24px;
    overflow: hidden;
    animation: fade .25s ease-out;
  }
  .overlay[hidden] { display: none; }
  .winner-card {
    text-align: center;
    max-width: 94vw;
    animation: pop .45s cubic-bezier(.2, 1.4, .4, 1);
  }
  .winner-card small { display: block; font-size: clamp(18px, 2.6vw, 32px); color: var(--muted); margin-bottom: 10px; }
  .winner-name {
    font-size: clamp(48px, 12vw, 190px);
    font-weight: 900;
    line-height: 1.05;
    color: var(--accent);
    overflow-wrap: anywhere;
    text-shadow: 0 6px 30px rgba(0,0,0,.45);
  }
  .winner-card .btn { margin-top: 28px; font-size: 18px; padding: 10px 22px; }
  .confetti { position: absolute; top: -20px; width: 10px; height: 16px; opacity: .95; animation: fall linear forwards; pointer-events: none; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
  @media (prefers-reduced-motion: reduce) { .confetti { display: none; } .winner-card, .overlay { animation: none; } }

  @media (max-width: 900px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto; padding: 14px; height: auto; min-height: 100vh; overflow: auto; }
    .stage { height: auto; }
    .wheel-wrap { width: min(100%, 560px); }
    .panel { max-height: none; }
  }
</style>
</head>
<body>

<main class="stage">
  <div class="wheel-wrap">
    <canvas id="wheel" aria-label="Ruleta"></canvas>
    <button class="hub" id="hub" type="button">LANZAR</button>
  </div>
  <div class="result" id="result" aria-live="polite"></div>
</main>

<aside class="panel">
  <h1>Opciones</h1>
  <p>Escribe una opción por línea. La ruleta gira y, en un momento al azar, se lanza un dardo: la sección donde se clava es la ganadora.</p>
  <textarea id="items" spellcheck="false" aria-label="Opciones de la ruleta"></textarea>
  <div class="count" id="count"></div>
  <div class="row">
    <label class="check"><input type="checkbox" id="removeWinner"> Quitar la opción ganadora</label>
  </div>
  <div class="row">
    <label class="check"><input type="checkbox" id="sound" checked> Sonido</label>
    <button class="btn" id="shuffle" type="button">Mezclar</button>
  </div>
  <button class="btn primary" id="spin" type="button">Lanzar dardo</button>
</aside>

<canvas id="fx"></canvas>

<div class="overlay" id="winner" hidden role="dialog" aria-modal="true" aria-label="Ganador">
  <div class="winner-card">
    <small>¡Ganador!</small>
    <div class="winner-name" id="winnerName"></div>
    <button class="btn" id="closeWinner" type="button">Cerrar</button>
  </div>
</div>

<script>
(function () {
  const DEFAULT_ITEMS = ["Lima", "Tokio", "Estocolmo", "Bangkok", "Madrid", "Londres", "Montevideo", "Pekín", "Santo Domingo", "París", "Singapur", "Roma", "Berlín", "Washington", "Buenos Aires"];
  const COLORS = ["#6f7bf7", "#f6d860", "#ef6f6c", "#5cc7c2", "#4a55b5", "#f2a65a", "#7bc47f", "#b57edc"];
  const STORAGE_KEY = "ruleta.items";
  const TWO_PI = Math.PI * 2;

  const canvas = document.getElementById("wheel");
  const ctx = canvas.getContext("2d");
  const fxCanvas = document.getElementById("fx");
  const fctx = fxCanvas.getContext("2d");
  const textarea = document.getElementById("items");
  const countEl = document.getElementById("count");
  const resultEl = document.getElementById("result");
  const spinBtn = document.getElementById("spin");
  const hub = document.getElementById("hub");
  const removeChk = document.getElementById("removeWinner");
  const soundChk = document.getElementById("sound");

  let items = [];
  let rotation = 0;       // radianes
  let spinning = false;
  let highlight = -1;
  let size = 600;
  let P = null;           // lanzamiento actual (ruleta + dardo)
  let clock = 0;          // segundos desde el inicio del lanzamiento

  /* ---------- Utilidades ---------- */
  function rnd() {
    try { return crypto.getRandomValues(new Uint32Array(1))[0] / 4294967296; }
    catch (e) { return Math.random(); }
  }
  function readItems() {
    return textarea.value.split("\n").map(s => s.trim()).filter(Boolean);
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, textarea.value); } catch (e) {}
  }
  function load() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved !== null) return saved;
    } catch (e) {}
    return DEFAULT_ITEMS.join("\n");
  }
  function colorFor(i, n) {
    let c = i % COLORS.length;
    if (i === n - 1 && n > 1 && c === 0) c = 1; // el último no repite el color del primero
    return COLORS[c];
  }
  function isLight(hex) {
    const v = parseInt(hex.slice(1), 16);
    const r = v >> 16, g = (v >> 8) & 255, b = v & 255;
    return (0.299 * r + 0.587 * g + 0.114 * b) > 150;
  }
  function setStatus(msg) {
    resultEl.innerHTML = "";
    const s = document.createElement("small");
    s.textContent = msg;
    resultEl.appendChild(s);
  }

  /* ---------- Dibujo de la ruleta ---------- */
  function resize() {
    const rect = canvas.getBoundingClientRect();
    size = Math.max(200, Math.round(rect.width));
    const dpr = window.devicePixelRatio || 1;
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    fxCanvas.width = Math.round(window.innerWidth * dpr);
    fxCanvas.height = Math.round(window.innerHeight * dpr);
    draw();
    drawFx();
  }

  function fitText(text, maxWidth, fontSize) {
    ctx.font = "700 " + fontSize + "px system-ui, sans-serif";
    if (ctx.measureText(text).width <= maxWidth) return text;
    let t = text;
    while (t.length > 1 && ctx.measureText(t + "…").width > maxWidth) t = t.slice(0, -1);
    return t + "…";
  }

  function draw() {
    ctx.clearRect(0, 0, size, size);
    const cx = size / 2, cy = size / 2;
    const outer = size / 2 - 4;
    const rim = outer * 0.035;
    const r = outer - rim;
    const n = items.length;

    ctx.beginPath();
    ctx.arc(cx, cy, outer, 0, TWO_PI);
    ctx.fillStyle = "#e9edf8";
    ctx.fill();

    if (n === 0) {
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, TWO_PI);
      ctx.fillStyle = "#2a3c6e";
      ctx.fill();
      ctx.fillStyle = "#cfd8f5";
      ctx.font = "600 " + size * 0.04 + "px system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("Agrega opciones a la derecha", cx, cy - size * 0.1);
      return;
    }

    const arc = TWO_PI / n;
    const hubR = outer * 0.17;
    const textStart = hubR + r * 0.06;
    const textEnd = r * 0.93;
    const maxTextWidth = textEnd - textStart;
    const fontSize = Math.max(0, Math.min(r * 0.075, (arc * r * 0.45), 34));

    for (let i = 0; i < n; i++) {
      const a0 = rotation + i * arc;
      const color = colorFor(i, n);

      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, a0, a0 + arc);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();

      if (n <= 150) {
        ctx.strokeStyle = "rgba(255,255,255,.35)";
        ctx.lineWidth = n > 60 ? 0.5 : 1.5;
        ctx.stroke();
      }

      if (i === highlight) {
        ctx.fillStyle = "rgba(255,255,255,.38)";
        ctx.fill();
      }

      if (fontSize >= 5) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(a0 + arc / 2);
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        ctx.fillStyle = isLight(color) ? "#14213d" : "#ffffff";
        const label = fitText(items[i], maxTextWidth, fontSize);
        ctx.font = "700 " + fontSize + "px system-ui, sans-serif";
        ctx.fillText(label, textEnd, 0);
        ctx.restore();
      }

      if (n <= 60) {
        ctx.beginPath();
        ctx.arc(cx + Math.cos(a0) * (outer - rim / 2), cy + Math.sin(a0) * (outer - rim / 2), Math.max(2, rim * 0.28), 0, TWO_PI);
        ctx.fillStyle = "#ffffff";
        ctx.fill();
        ctx.strokeStyle = "rgba(20,33,61,.4)";
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }
  }

  /* ---------- Dardo ---------- */
  function geom() {
    const rect = canvas.getBoundingClientRect();
    const outer = rect.width / 2 - 4;
    return { cx: rect.left + rect.width / 2, cy: rect.top + rect.height / 2, r: outer - outer * 0.035 };
  }

  // Dibuja un dardo con la punta en (0,0) apuntando hacia +x (después se rota)
  function drawDart(x, y, ang, L, fore) {
    fctx.save();
    fctx.translate(x, y);
    fctx.rotate(ang);
    fctx.scale(fore, 1);
    fctx.shadowColor = "rgba(0,0,0,.45)";
    fctx.shadowBlur = L * 0.08;
    fctx.shadowOffsetY = L * 0.04;
    fctx.lineJoin = "round";
    fctx.lineWidth = Math.max(1, L * 0.012);
    fctx.strokeStyle = "#14213d";

    // aletas
    fctx.fillStyle = "#ef6f6c";
    fctx.beginPath();
    fctx.moveTo(-0.70 * L, -0.015 * L); fctx.lineTo(-0.97 * L, -0.15 * L);
    fctx.lineTo(-1.04 * L, -0.15 * L); fctx.lineTo(-0.98 * L, -0.015 * L);
    fctx.closePath(); fctx.fill(); fctx.stroke();
    fctx.fillStyle = "#c94c4a";
    fctx.beginPath();
    fctx.moveTo(-0.70 * L, 0.015 * L); fctx.lineTo(-0.97 * L, 0.15 * L);
    fctx.lineTo(-1.04 * L, 0.15 * L); fctx.lineTo(-0.98 * L, 0.015 * L);
    fctx.closePath(); fctx.fill(); fctx.stroke();

    // eje
    fctx.shadowColor = "transparent";
    fctx.fillStyle = "#26324f";
    fctx.fillRect(-0.80 * L, -0.02 * L, 0.26 * L, 0.04 * L);

    // cuerpo
    fctx.fillStyle = "#ffd54a";
    fctx.fillRect(-0.56 * L, -0.055 * L, 0.30 * L, 0.11 * L);
    fctx.strokeRect(-0.56 * L, -0.055 * L, 0.30 * L, 0.11 * L);
    fctx.fillStyle = "#14213d";
    fctx.fillRect(-0.47 * L, -0.055 * L, 0.025 * L, 0.11 * L);
    fctx.fillRect(-0.37 * L, -0.055 * L, 0.025 * L, 0.11 * L);

    // punta
    fctx.fillStyle = "#dfe3ee";
    fctx.beginPath();
    fctx.moveTo(0, 0); fctx.lineTo(-0.27 * L, -0.025 * L); fctx.lineTo(-0.27 * L, 0.025 * L);
    fctx.closePath(); fctx.fill(); fctx.stroke();
    fctx.restore();
  }

  // Extremos del vuelo: sale desde fuera de la pantalla y llega al punto de impacto
  function flightEnds(g) {
    const S = { x: g.cx + Math.cos(P.psi) * P.dist, y: g.cy + Math.sin(P.psi) * P.dist };
    const T = { x: g.cx + P.rho * g.r * Math.cos(P.phi), y: g.cy + P.rho * g.r * Math.sin(P.phi) };
    return { S: S, T: T, ang: Math.atan2(T.y - S.y, T.x - S.x) };
  }

  function drawFx() {
    const dpr = window.devicePixelRatio || 1;
    fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    fctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    if (!P) return;
    const g = geom();
    const e = flightEnds(g);
    const L = 0.32 * g.r;

    // Vuelo rápido, con estela
    if (clock >= P.tL && clock < P.T) {
      const s = (clock - P.tL) / P.F;
      [{ d: 0.10, a: 0.10 }, { d: 0.065, a: 0.2 }, { d: 0.032, a: 0.4 }, { d: 0, a: 1 }].forEach(gh => {
        const ss = s - gh.d;
        if (ss < 0) return;
        const x = e.S.x + (e.T.x - e.S.x) * ss;
        const y = e.S.y + (e.T.y - e.S.y) * ss;
        fctx.globalAlpha = gh.a;
        drawDart(x, y, e.ang, L * (1 + 0.5 * (1 - ss)), 1 - 0.22 * Math.pow(ss, 4));
      });
      fctx.globalAlpha = 1;
    }

    // Impacto y dardo clavado
    if (clock >= P.T && P.dirLocal !== undefined) {
      const age = clock - P.T;
      const ox = P.ox, oy = P.oy;

      // destello grande
      if (age < 0.3) {
        const k = 1 - age / 0.3;
        const R = g.r * 0.9;
        const gr = fctx.createRadialGradient(ox, oy, 0, ox, oy, R);
        gr.addColorStop(0, "rgba(255,255,255," + (0.95 * k).toFixed(3) + ")");
        gr.addColorStop(0.35, "rgba(255,226,120," + (0.4 * k).toFixed(3) + ")");
        gr.addColorStop(1, "rgba(255,213,74,0)");
        fctx.fillStyle = gr;
        fctx.beginPath(); fctx.arc(ox, oy, R, 0, TWO_PI); fctx.fill();

        // rayos de la explosión
        fctx.lineCap = "round";
        const grow = 1 - k;
        P.rays.forEach(ry => {
          const d0 = g.r * 0.05 + g.r * 0.12 * grow;
          const d1 = g.r * (0.14 + ry.l * 0.5 * Math.sqrt(grow + 0.05));
          fctx.beginPath();
          fctx.moveTo(ox + Math.cos(ry.a) * d0, oy + Math.sin(ry.a) * d0);
          fctx.lineTo(ox + Math.cos(ry.a) * d1, oy + Math.sin(ry.a) * d1);
          fctx.strokeStyle = "rgba(255,255,255," + k.toFixed(3) + ")";
          fctx.lineWidth = 2 + 7 * k;
          fctx.stroke();
        });
      }
      // ondas de choque
      [[0, 0.5, 8], [0.05, 0.34, 5], [0.11, 0.2, 3]].forEach(w => {
        const a2 = age - w[0];
        if (a2 > 0 && a2 < 0.6) {
          const k = a2 / 0.6;
          const ease = 1 - Math.pow(1 - k, 2);
          fctx.beginPath();
          fctx.arc(ox, oy, g.r * (0.03 + w[1] * ease), 0, TWO_PI);
          fctx.strokeStyle = "rgba(255,255,255," + (0.9 * (1 - k)).toFixed(3) + ")";
          fctx.lineWidth = w[2] * (1 - k * 0.6);
          fctx.stroke();
        }
      });
      // chispas
      if (age < 0.8) {
        fctx.lineCap = "round";
        P.sparks.forEach(sp => {
          const d = sp.v * g.r * age * (1 - age * 0.55);
          const d0 = Math.max(0, d - sp.v * g.r * 0.07);
          fctx.beginPath();
          fctx.moveTo(ox + Math.cos(sp.a) * d0, oy + Math.sin(sp.a) * d0);
          fctx.lineTo(ox + Math.cos(sp.a) * d, oy + Math.sin(sp.a) * d);
          fctx.strokeStyle = (sp.hot ? "rgba(255,213,74," : "rgba(255,255,255,") + (1 - age / 0.8).toFixed(3) + ")";
          fctx.lineWidth = sp.w;
          fctx.stroke();
        });
      }

      // dardo clavado: vibra con fuerza y se calma
      const phi = rotation + P.alpha;
      const x = g.cx + P.rho * g.r * Math.cos(phi);
      const y = g.cy + P.rho * g.r * Math.sin(phi);
      const wob = age < 1.0 ? Math.sin(age * 55) * 0.35 * Math.pow(1 - age / 1.0, 2) : 0;
      drawDart(x, y, rotation + P.dirLocal + wob, L, 0.78);
    }
  }

  /* ---------- Sonido ---------- */
  let audioCtx = null;
  function getAudio() {
    if (!soundChk.checked) return null;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    } catch (e) { return null; }
  }
  function noiseBuffer(ac, dur) {
    const buf = ac.createBuffer(1, Math.floor(ac.sampleRate * dur), ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  }
  function whoosh() {
    const ac = getAudio(); if (!ac) return;
    const now = ac.currentTime;
    const src = ac.createBufferSource();
    src.buffer = noiseBuffer(ac, 0.4);
    const bp = ac.createBiquadFilter();
    bp.type = "bandpass"; bp.Q.value = 1.4;
    bp.frequency.setValueAtTime(500, now);
    bp.frequency.exponentialRampToValueAtTime(3500, now + 0.32);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(0.4, now + 0.28);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.36);
    src.connect(bp); bp.connect(g); g.connect(ac.destination);
    src.start(now); src.stop(now + 0.4);
  }
  function thud() {
    const ac = getAudio(); if (!ac) return;
    const now = ac.currentTime;
    // golpe grave
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(150, now);
    o.frequency.exponentialRampToValueAtTime(34, now + 0.3);
    g.gain.setValueAtTime(1.0, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);
    o.connect(g); g.connect(ac.destination);
    o.start(now); o.stop(now + 0.55);
    // chasquido seco
    const src = ac.createBufferSource();
    src.buffer = noiseBuffer(ac, 0.12);
    const hp = ac.createBiquadFilter();
    hp.type = "highpass"; hp.frequency.value = 900;
    const g2 = ac.createGain();
    g2.gain.setValueAtTime(0.7, now);
    g2.gain.exponentialRampToValueAtTime(0.0001, now + 0.1);
    src.connect(hp); hp.connect(g2); g2.connect(ac.destination);
    src.start(now); src.stop(now + 0.12);
    // vibración metálica del dardo
    const m = ac.createOscillator();
    const g3 = ac.createGain();
    m.type = "triangle";
    m.frequency.setValueAtTime(1250, now);
    g3.gain.setValueAtTime(0.18, now);
    g3.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);
    m.connect(g3); g3.connect(ac.destination);
    m.start(now); m.stop(now + 0.4);
  }
  function fanfare() {
    const ac = getAudio(); if (!ac) return;
    const notes = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5];
    const times = [0, 0.13, 0.26, 0.39, 0.62, 0.75];
    const now = ac.currentTime;
    notes.forEach((f, i) => {
      const o = ac.createOscillator();
      const g = ac.createGain();
      const dur = i >= 4 ? 0.5 : 0.16;
      o.type = "triangle";
      o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, now + times[i]);
      g.gain.exponentialRampToValueAtTime(0.18, now + times[i] + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, now + times[i] + dur);
      o.connect(g); g.connect(ac.destination);
      o.start(now + times[i]);
      o.stop(now + times[i] + dur + 0.05);
    });
  }

  /* ---------- Ganador ---------- */
  const overlay = document.getElementById("winner");
  const winnerName = document.getElementById("winnerName");

  function showWinner(name) {
    winnerName.textContent = name;
    overlay.querySelectorAll(".confetti").forEach(el => el.remove());
    for (let i = 0; i < 70; i++) {
      const c = document.createElement("span");
      c.className = "confetti";
      c.style.left = Math.random() * 100 + "%";
      c.style.background = COLORS[i % COLORS.length];
      c.style.animationDuration = (2.5 + Math.random() * 2.5) + "s";
      c.style.animationDelay = (Math.random() * 1.2) + "s";
      overlay.appendChild(c);
    }
    overlay.hidden = false;
    document.getElementById("closeWinner").focus();
    fanfare();
  }
  function hideWinner() { overlay.hidden = true; }

  /* ---------- Lanzamiento ---------- */
  function setBusy(b) {
    spinning = b;
    spinBtn.disabled = b;
    hub.disabled = b;
    textarea.disabled = b;
    document.getElementById("shuffle").disabled = b;
  }

  const wrap = document.querySelector(".wheel-wrap");
  const mod = (a) => ((a % TWO_PI) + TWO_PI) % TWO_PI;

  // Rotación de la ruleta en función del tiempo: acelera, gira muy rápido y frena tras el impacto
  function rotAt(t) {
    const w = P.omega, a = P.a;
    if (t < a) return P.rot0 + w * t * t / (2 * a);
    if (t <= P.T) return P.rot0 + w * (t - a / 2);
    // Tras el impacto: frenazo brusco (queda ~40% de la velocidad) y luego se detiene muy despacio
    const u = Math.min(t - P.T, P.D);
    const k = 0.4, tau = 0.15;
    return P.rot0 + w * (P.T - a / 2) + w * (k * (u - u * u / (2 * P.D)) + (1 - k) * tau * (1 - Math.exp(-u / tau)));
  }

  function throwDart() {
    if (spinning) return;
    items = readItems();
    if (items.length < 2) {
      resultEl.textContent = items.length === 1 ? items[0] : "Agrega al menos 2 opciones";
      draw();
      return;
    }
    getAudio(); // desbloquea el audio con el clic
    highlight = -1;
    setStatus("Girando…");
    setBusy(true);

    const n = items.length;
    const arc = TWO_PI / n;

    // Todo se sortea de forma independiente: velocidad, sentido, momento y punto de impacto.
    // El ganador NO se elige antes: se obtiene después, mirando qué sección quedó bajo el dardo.
    const tL = 1.2 + rnd() * 3.0;
    P = {
      omega: (11 + rnd() * 7) * (rnd() < 0.5 ? -1 : 1),
      a: 0.8, D: 5.5, F: 0.32, tL: tL, T: tL + 0.32,
      rot0: rotation,
      psi: rnd() * TWO_PI,                                   // dirección desde la que llega el dardo
      dist: Math.hypot(window.innerWidth, window.innerHeight) * 0.8,
      t0: performance.now(),
      whoosh: false, hit: false
    };
    P.rotT = rotAt(P.T);                                      // posición de la ruleta en el instante del impacto

    // Punto de impacto al azar en pantalla (evitando justo la línea entre dos secciones)
    let tries = 0, frac;
    do {
      P.phi = rnd() * TWO_PI;
      P.rho = 0.3 + 0.58 * rnd();
      P.alpha = mod(P.phi - P.rotT);                          // ángulo dentro de la ruleta
      frac = (P.alpha / arc) % 1;
    } while ((frac < 0.1 || frac > 0.9) && ++tries < 40);
    P.idx = Math.min(n - 1, Math.floor(P.alpha / arc));       // sección que recibe el dardo

    P.sparks = [];
    for (let i = 0; i < 44; i++) {
      P.sparks.push({ a: rnd() * TWO_PI, v: 0.8 + rnd() * 1.8, w: 2 + rnd() * 3.5, hot: rnd() < 0.5 });
    }
    P.rays = [];
    for (let i = 0; i < 14; i++) P.rays.push({ a: rnd() * TWO_PI, l: 0.5 + rnd() * 0.9 });
    clock = 0;
    requestAnimationFrame(frame);
  }

  function frame(now) {
    const t = (now - P.t0) / 1000;
    const end = P.T + P.D;
    clock = Math.min(t, end);
    rotation = rotAt(clock);

    if (!P.whoosh && clock >= P.tL) {
      P.whoosh = true;
      whoosh();
      setStatus("¡Dardo lanzado!");
    }
    if (!P.hit && clock >= P.T) {
      P.hit = true;
      const g = geom();
      const e = flightEnds(g);
      P.ox = e.T.x; P.oy = e.T.y;
      P.dirLocal = e.ang - P.rotT;
      thud();
      setStatus("¡Impacto!");
    }

    // Sacudida de la ruleta con el golpe
    const age = clock - P.T;
    if (P.hit && age < 0.6) {
      const k = Math.pow(1 - age / 0.6, 2);
      wrap.style.transform = "translate(" + ((Math.random() - 0.5) * 2 * 34 * k).toFixed(1) + "px," + ((Math.random() - 0.5) * 2 * 34 * k).toFixed(1) + "px) rotate(" + ((Math.random() - 0.5) * 2.4 * k).toFixed(2) + "deg)";
    } else {
      wrap.style.transform = "";
    }

    draw();
    drawFx();

    if (t < end) {
      requestAnimationFrame(frame);
    } else {
      wrap.style.transform = "";
      highlight = P.idx;
      draw();
      drawFx();
      setTimeout(() => finish(P.idx), 700);
    }
  }

  function finish(idx) {
    const winner = items[idx];
    resultEl.innerHTML = "<small>Resultado</small>";
    resultEl.appendChild(document.createTextNode(winner));
    showWinner(winner);
    rotation = ((rotation % TWO_PI) + TWO_PI) % TWO_PI;
    if (removeChk.checked) {
      const lines = textarea.value.split("\n");
      const pos = lines.findIndex(l => l.trim() === winner);
      if (pos >= 0) lines.splice(pos, 1);
      textarea.value = lines.join("\n");
      save();
      updateCount();
      setTimeout(() => {
        if (!spinning) { items = readItems(); highlight = -1; P = null; draw(); drawFx(); }
      }, 1600);
    }
    setBusy(false);
  }

  /* ---------- Edición de la lista ---------- */
  function updateCount() {
    const n = readItems().length;
    countEl.textContent = n + (n === 1 ? " opción" : " opciones");
  }
  function onEdit() {
    items = readItems();
    highlight = -1;
    P = null;
    updateCount();
    save();
    draw();
    drawFx();
  }
  function shuffle() {
    const arr = readItems();
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    textarea.value = arr.join("\n");
    onEdit();
  }

  /* ---------- Inicio ---------- */
  textarea.value = load();
  items = readItems();
  updateCount();
  textarea.addEventListener("input", onEdit);
  spinBtn.addEventListener("click", throwDart);
  hub.addEventListener("click", throwDart);
  document.getElementById("shuffle").addEventListener("click", shuffle);
  document.getElementById("closeWinner").addEventListener("click", hideWinner);
  overlay.addEventListener("click", e => { if (e.target === overlay) hideWinner(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") hideWinner(); });
  window.addEventListener("resize", resize);
  window.addEventListener("scroll", drawFx, { passive: true });
  resize();
})();
</script>
</body>
</html>
